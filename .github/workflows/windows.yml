name: Build Windows app

on:
  push:
    branches: [main]
    paths:
      - "Windows/**"
      - "Support/**"
      - "Tests/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "Windows/**"
      - "Support/**"
      - "Tests/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: Test Cursor bridge and Windows command wrappers
        run: node --test Tests/cursor-codex-bridge-tests.mjs

      - name: Restore
        run: dotnet restore Windows/CodexSyncBar.Windows.sln --runtime win-x64

      - name: Test Windows core
        run: dotnet test Windows/CodexSyncBar.Windows.Core.Tests/CodexSyncBar.Windows.Core.Tests.csproj --configuration Release --no-restore

      - name: Build WinUI 3 x64
        run: dotnet build Windows/CodexSyncBar.Windows/CodexSyncBar.Windows.csproj --configuration Release --property:Platform=x64 --no-restore

      - name: Restore x86 runtime
        run: dotnet restore Windows/CodexSyncBar.Windows.sln --runtime win-x86

      - name: Build WinUI 3 x86
        run: dotnet build Windows/CodexSyncBar.Windows/CodexSyncBar.Windows.csproj --configuration Release --property:Platform=x86 --no-restore

      - name: Restore ARM64 runtime
        run: dotnet restore Windows/CodexSyncBar.Windows.sln --runtime win-arm64

      - name: Build WinUI 3 ARM64
        run: dotnet build Windows/CodexSyncBar.Windows/CodexSyncBar.Windows.csproj --configuration Release --property:Platform=ARM64 --no-restore

      - name: Verify bundled PDF extractor
        shell: pwsh
        run: |
          $helpers = @(
            "Windows/CodexSyncBar.Windows/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/Runtime/PdfExtractor/cursor-file-extractor.exe",
            "Windows/CodexSyncBar.Windows/bin/x86/Release/net10.0-windows10.0.26100.0/win-x86/Runtime/PdfExtractor/cursor-file-extractor.exe",
            "Windows/CodexSyncBar.Windows/bin/ARM64/Release/net10.0-windows10.0.26100.0/win-arm64/Runtime/PdfExtractor/cursor-file-extractor.exe"
          )
          foreach ($helper in $helpers) {
            if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) {
              throw "Bundled PDF extractor was not copied to the WinUI output: $helper"
            }
          }
