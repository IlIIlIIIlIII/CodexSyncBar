name: Release macOS app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout tagged commit
        run: |
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD

      - name: Verify source
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          swift --version
          if ! command -v lockf >/dev/null && ! command -v flock >/dev/null; then
            brew install util-linux
            echo "$(brew --prefix util-linux)/bin" >> "$GITHUB_PATH"
            export PATH="$(brew --prefix util-linux)/bin:$PATH"
          fi
          bash Tests/helper-contract-tests.sh
          swift test

      - name: Configure Developer ID signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$DEVELOPER_ID_P12_BASE64"
          test -n "$DEVELOPER_ID_P12_PASSWORD"
          test -n "$NOTARY_KEY_BASE64"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER_ID"
          keychain_path="$RUNNER_TEMP/codex-syncbar-signing.keychain-db"
          keychain_password=$(uuidgen)
          printf '%s' "$DEVELOPER_ID_P12_BASE64" | /usr/bin/base64 -D \
            > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$NOTARY_KEY_BASE64" | /usr/bin/base64 -D \
            > "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/developer-id.p12" \
            -k "$keychain_path" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          identity=$(security find-identity -v -p codesigning "$keychain_path" \
            | awk '/Developer ID Application/ {print $2; exit}')
          test -n "$identity"
          echo "CODEX_SYNCBAR_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "CODEX_SYNCBAR_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Build universal app
        run: |
          CODEX_SYNCBAR_UNIVERSAL=1 ./build-app.sh "$PWD/release-assets"
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
          lipo -archs "release-assets/Codex SyncBar.app/Contents/MacOS/CodexSyncBar" \
            | grep -q 'x86_64 arm64\|arm64 x86_64'
          test "$(stat -f '%Lp' 'release-assets/Codex SyncBar.app/Contents/Resources/codex-syncbar-askpass')" = 700
          codesign --verify --deep --strict --verbose=2 "release-assets/Codex SyncBar.app"
          codesign -dv --verbose=4 "release-assets/Codex SyncBar.app" 2>&1 \
            | grep -q 'Authority=Developer ID Application:'

      - name: Notarize and staple app
        run: |
          version="${GITHUB_REF_NAME#v}"
          xcrun notarytool submit "release-assets/Codex SyncBar.zip" \
            --key "$APPLE_NOTARY_KEY_PATH" \
            --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple "release-assets/Codex SyncBar.app"
          xcrun stapler validate "release-assets/Codex SyncBar.app"
          codesign --verify --deep --strict --verbose=2 "release-assets/Codex SyncBar.app"
          spctl --assess --type execute --verbose=4 "release-assets/Codex SyncBar.app"
          rm "release-assets/Codex SyncBar.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "release-assets/Codex SyncBar.app" \
            "release-assets/Codex-SyncBar-$version-macOS-universal.zip"
          cd release-assets
          shasum -a 256 "Codex-SyncBar-$version-macOS-universal.zip" > SHA256SUMS
          cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "release-assets/Codex-SyncBar-$version-macOS-universal.zip" \
            "release-assets/SHA256SUMS" \
            --title "Codex SyncBar $version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${CODEX_SYNCBAR_SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$CODEX_SYNCBAR_SIGNING_KEYCHAIN" || true
          fi
